<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <link href="style.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="bgfx"></div>
    <div id="wrapper">
        Loading contents...
    </div>
    <div id="topbar">
    </div>

  <script>
    const url = new URL(window.location.href);
    const params = url.searchParams;
    let page = 'home'

    if (params.has('page')) {
        page = params.get('page')
    }

    function createBackgroundDooDoo() {
        for(let i = 0; i < 100; i++) {
        const circle = document.createElement('div')
        circle.style.backgroundColor = "green"
        circle.style.position = "fixed"
        circle.className = 'bgcircle'
        circle.style.left = random(-200, window.innerWidth) + 'px'
        circle.style.top = random(-200, window.innerHeight) + 'px'
        circle.style.background = `radial-gradient(circle, rgba(${random(0,255)}, ${random(0,0)}, ${random(0,255)}) -50%, rgba(255, 255, 255, 0) 70%)`
        document.getElementById('bgfx').appendChild(circle)
        }
    }
    createBackgroundDooDoo()

    function random(min, max) {
        return Math.random() * (max - min) + min;
    }

    function generateTopButtons() {
        const buttons = ['home', 'play', 'news', 'comments', 'stats', 'trailer', 'mods', 'old layout']
        for(let i = 0; i < buttons.length; i++) {
            const element = document.createElement('div')
            element.className = 'topbutton'
            element.textContent = buttons[i]
            element.addEventListener('click', () => {
                console.log(buttons[i]);
                page = buttons[i];
                refreshPage(page)
                element.selected = true
            })
            if(element.textContent == 'comments'){
                const counter = document.createElement('span')
                counter.textContent = 0
                element.appendChild(counter)
                counter.id = 'commentcount'
                counter.style = `
                background-color: rgba(202, 202, 202, 0.486);
                margin-left: 5px;
                padding: 2px;
                border-radius: 2px;
                color: white
                `
            }
            document.getElementById('topbar').appendChild(element)
        }
    }

    generateTopButtons()

    function refreshPage(page) {
        params.set('page', page);
        if(page == 'old layout') {
            window.open('old/index.html')
        }
        else {
        const newUrl = `${url.origin}${url.pathname}?${params.toString()}`;
        window.history.replaceState({}, '', newUrl);
        this.selected = false

        const inject = document.getElementById('wrapper')

        fetch(`pages/${page}.html`)
        .then(response => {
            if(!response.ok) throw new Error('network error')
            return response.text()
        })
        .then(page => {
            console.log('result')
            inject.innerHTML = page
        })
        .catch(err => {
            console.log(`that doesn't seem to exist hehe`)
            inject.textContent = "404 Error. Might be your internet?"
        })
    }

    const topbuttons = document.getElementsByClassName('topbutton')
    for(let i = 0; i < topbuttons.length; i++) {
        const name = topbuttons[i].textContent
        const thisButton = topbuttons[i]
        if(page == name) {
            console.log(name)
            thisButton.style.backgroundColor = 'rgba(170, 170, 170, 30%)'
            thisButton.style.color = 'white'
        } else {
            thisButton.style.backgroundColor = ''
            thisButton.style.color = ''
        }
    }
    }

    function toggleSpoiler() {
        const e = document.getElementById('spoiler-content')
        e.hidden = !e.hidden
        
    }

    refreshPage(page)

    document.getElementById('wrapper').style.maxHeight = window.innerHeight - 200 + 'px'

    fetch('https://script.google.com/macros/s/AKfycbx9ketAjLTkMTrnFWnl408croGQhcmwvX6JAet7RMKAaUn2aPhoVtQpPOcWSslmYPV5/exec?count')
    .then(response => response.json())
    .then(data => {
        console.log(data)
        document.getElementById('commentcount').textContent = data.count
    })
  </script>

<!-- for the comments to function -->
<script>
    let username = ''
    const getname = localStorage.getItem('username')
    if(getname === null) {
        
    } else {
        username = getname
    }
    const gas = 'https://script.google.com/macros/s/AKfycbx7_rWLlBTJ-PjTVnncBxCRneTdLkF7WLPi_R0e1uKaV_hLdwS-nEpvTKDLLtifEL0-/exec'
    let commentList = ''
    loadComments()
    function loadComments() {
    fetch(gas)
    .then(response => response.json())
    .then(data => {
        console.log(data)
        commentList = data
        renderComments()
    })
}

    function renderComments() {
        const commentslist = document.getElementById('comments')
        commentslist.innerHTML = ''
        for(let i = 0; i < commentList.length; i++) {
            const comment = document.createElement('div')
            const username1 = document.createElement('span')
            const contents = document.createElement('span')
            const date = document.createElement('span')
            const badge = document.createElement('div')
            const usernametop = document.createElement('div')

            const thisComment = commentList[commentList.length-1-i]

            comment.className = "comment"
            username1.className = "username"
            contents.className = "contents"
            usernametop.className = "usernametop"
            date.className = 'date'
            badge.className = 'badge'

            contents.textContent = thisComment.comment
            username1.textContent = thisComment.username
            date.textContent = thisComment.date
            badge.textContent = 'dev'
            
            username1.href = 'https://www.google.com'

            comment.appendChild(usernametop)
            usernametop.appendChild(username1)
            if(thisComment.username.includes("Greedy Allay")) {
                usernametop.appendChild(badge)
            }
            if(thisComment.username == username) {
                comment.style = 'background-color: rgb(255, 97, 97); margin-left: 60%'
                badge.style = 'background-color: white; color: black'
            }
            comment.appendChild(contents)
            comment.appendChild(date)
            commentslist.appendChild(comment)
        }
    }

    function submitComment(name, comment) {
    fetch(gas, {
        method: "POST",
        contentType: "application/json",
        body: JSON.stringify({
            username: name,
            comment: comment
        }),
        headers: {
        "Content-Type": "text/plain;charset=utf-8",
      },
    })
    location.reload()
    }

</script>
